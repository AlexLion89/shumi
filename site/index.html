<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7EEE0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1B19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Полка">
<title>Книжная полка</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Соединения прогреваются заранее: на мобильном каждое новое TLS-соединение — заметная пауза. -->
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="preconnect" href="https://api.fantlab.ru" crossorigin>
<link rel="preconnect" href="https://fantlab.ru">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>

<section id="login" class="login" hidden>
  <img src="icon-192.png" alt="">
  <h1>Книжная полка</h1>
  <p>Введи ключ полки. Это нужно один раз — дальше телефон его запомнит.</p>
  <form id="login-form">
    <input id="key" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="Ключ полки">
    <button class="pill main" type="submit">Открыть полку</button>
  </form>
  <p id="login-err" class="err" role="alert"></p>
</section>

<div id="app" hidden>
  <button id="update" class="update" type="button" hidden>Вышла новая версия · <b>Обновить</b></button>
  <button id="sync" class="sync" type="button" hidden></button>
  <button id="fb-open" class="fb-btn" type="button" aria-label="Замечания и пожелания">💬<span id="fb-dot" class="dot" hidden></span></button>
  <main>
    <!-- Заголовок и «найти на полке» — постоянные: перерисовывается только содержимое, иначе строка теряла бы фокус. -->
    <section id="v-shelf" class="view">
      <h1>Полка</h1>
      <input id="f-shelf" class="filter" type="search" placeholder="Найти на полке" autocomplete="off" autocapitalize="off" hidden>
      <div id="b-shelf"></div>
    </section>
    <section id="v-want" class="view" hidden>
      <h1>Хочу прочитать</h1>
      <input id="f-want" class="filter" type="search" placeholder="Найти среди «Хочу»" autocomplete="off" autocapitalize="off" hidden>
      <div id="b-want"></div>
    </section>
    <section id="v-find" class="view" hidden>
      <h1>Найти книгу</h1>
      <form id="find-form" role="search">
        <input id="q" type="search" placeholder="Название или автор" autocomplete="off" autocapitalize="off" enterkeyhint="search">
      </form>
      <div id="find-status" class="sources" aria-live="polite"></div>
      <ul id="results" class="results"></ul>
      <button id="manual" class="link" type="button">Нет нужной книги? Добавить вручную</button>
    </section>
    <section id="v-stats" class="view" hidden></section>
    <section id="v-feedback" class="view" hidden>
      <h1>Что улучшить?</h1>
      <p class="sub">Что неудобно, чего не хватает, какая книга не нашлась — любая мелочь пригодится. Ответ появится здесь же.</p>
      <form id="fb-form">
        <textarea id="fb-text" rows="4" placeholder="Например: хочу видеть, сколько страниц прочитала за год"></textarea>
        <button class="pill main" type="submit">Отправить</button>
      </form>
      <div id="fb-list"></div>
    </section>
  </main>
  <!-- Нижняя панель — как на books.sirenyov.link: значок из data-icon, подпись, у активной — полоска сверху. -->
  <nav class="tabs">
    <button type="button" data-tab="shelf" data-icon="📚">Полка</button>
    <button type="button" data-tab="want" data-icon="🔖">Хочу</button>
    <button type="button" data-tab="find" data-icon="🔍">Найти</button>
    <button type="button" data-tab="stats" data-icon="📊">Итоги</button>
  </nav>
</div>

<dialog id="sheet" class="sheet"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
