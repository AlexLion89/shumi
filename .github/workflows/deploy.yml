name: Выкладка

# Тесты → Worker (миграции D1 и код) и сайт на GitHub Pages → проверка выложенного.
# Репозиторий публичный и логи видны всем: секреты GitHub маскирует, остальное в вывод не идёт.
on:
  push:
    branches: [main]
    paths-ignore: [.github/workflows/cloudflare-setup.yml, README.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  API: https://shumi-api.sirenyov.workers.dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  worker:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Миграции D1
        run: npx --yes wrangler@4 d1 migrations apply shumi --remote
      - name: Выкладка Worker
        run: npx --yes wrangler@4 deploy

  pages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  smoke:
    needs: [worker, pages]
    runs-on: ubuntu-latest
    steps:
      - name: Worker отвечает
        run: curl -sf --retry 3 "$API/ping"
      - name: Каждый каталог находит свою эталонную книгу
        run: |
          check() {
            n=$(curl -s --retry 2 -m 20 "$API/search/$1?q=$(jq -rn --arg q "$2" '$q|@uri')" | jq '.items | length // 0')
            echo "$1 «$2»: $n"
            [ "${n:-0}" -ge 1 ] || { echo "::error::$1 не нашёл «$2»"; return 1; }
          }
          fail=0
          check litres "Магия утра" || fail=1
          check fantlab "Зулейха открывает глаза" || fail=1
          check openlibrary "Atomic Habits" || fail=1
          exit $fail
      - name: Сайт открывается
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 https://shumi.sirenyov.link/ping.json)
          echo "shumi.sirenyov.link: $code"
          [ "$code" = 200 ] || echo "::warning::shumi.sirenyov.link отвечает $code — проверь домен в Settings → Pages"
